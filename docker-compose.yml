services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clientes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_R2DBC_URL: r2dbc:postgresql://db:5432/clientes_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Configura la conexión a Azure Event Hubs si está disponible:
      # EVENTHUB_CONNECTION_STRING: "Endpoint=sb://..."
      # EVENTHUB_NAME: clientes-trace
    depends_on:
      db:
        condition: service_healthy
