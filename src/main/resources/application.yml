spring:
  application:
    name: clientes-api-ibk
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/clientes_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  region: este2
  eventhub:
    enabled: ${EVENTHUB_ENABLED:false}
    connection-string: ${EVENTHUB_CONNECTION_STRING:}
    name: ${EVENTHUB_NAME:}
